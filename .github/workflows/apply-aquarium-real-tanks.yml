name: Apply real aquarium tank visuals

on:
  push:
    branches:
      - agent/aquarium-real-tanks

permissions:
  contents: write

jobs:
  patch-build-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-real-tanks
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch aquarium rendering
        run: python scripts/patch_aquarium_real_tanks.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx
          git commit -m "Render aquarium exhibits as real fish tanks"

      - name: Remove one-time patch files
        run: |
          git rm .github/workflows/apply-aquarium-real-tanks.yml scripts/patch_aquarium_real_tanks.py
          git commit -m "Remove one-time aquarium tank patch tools"
          git push origin HEAD:agent/aquarium-real-tanks
