name: One-time redeploy Fire early world

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-redeploy-fire-early.yml"

permissions:
  contents: write

jobs:
  verify-and-redeploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify Fire rendering
        run: npx eslint components/Shop.tsx
      - name: Production build
        run: npm run build
      - name: Commit verified redeploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-redeploy-fire-early.yml
          git add .github/workflows/one-time-redeploy-fire-early.yml
          git commit -m "Redeploy verified Fire early outdoor world"
          git push origin main
