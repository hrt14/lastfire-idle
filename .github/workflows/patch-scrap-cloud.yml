name: Patch Scrap Planet cloud sync

on:
  push:
    branches:
      - agent/scrap-planet

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scrap-planet
      - name: Start shared cloud sync on the Scrap route
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/ScrapPlanet.tsx')
          text = path.read_text()
          import_anchor = 'import { formatNumber } from "@/lib/format";\n'
          if 'import { startCloud } from "@/lib/cloud";' not in text:
              text = text.replace(import_anchor, import_anchor + 'import { startCloud } from "@/lib/cloud";\n', 1)
          effect_anchor = '  useEffect(() => {\n    const loaded = loadScrap();\n'
          if '    startCloud();\n    const loaded = loadScrap();' not in text:
              text = text.replace(effect_anchor, '  useEffect(() => {\n    startCloud();\n    const loaded = loadScrap();\n', 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-scrap-cloud.yml
      - name: Commit cloud integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/ScrapPlanet.tsx .github/workflows/patch-scrap-cloud.yml
          git commit -m "Start cloud sync on Scrap Planet"
          git push origin HEAD:agent/scrap-planet
