name: One-time Fire night forest density

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fire-night-forest-density.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Enrich Fire night forest
        run: python3 scripts/patch_fire_night_forest_density.py
      - name: Install dependencies
        run: npm ci
      - name: Lint changed code
        run: npx eslint components/Shop.tsx lib/fire.ts
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fire-night-forest-density.yml
          rm -f scripts/patch_fire_night_forest_density.py
          git add components/Shop.tsx lib/fire.ts docs/fire-zones.md .github/workflows/one-time-fire-night-forest-density.yml scripts/patch_fire_night_forest_density.py
          git commit -m "Enrich Fire night forest exploration"
          git push origin main
