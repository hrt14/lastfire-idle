name: Expand Taiga same-era civilization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Taiga expansion
        run: python scripts/expand-taiga-era.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit expansion and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stages.ts lib/taiga.ts lib/shop.ts
          git rm scripts/expand-taiga-era.py .github/workflows/expand-taiga-era.yml
          git commit -m "Add same-era Taiga civilization expansion"
          git pull --rebase origin main
          git push
