name: Expand Taiga same-era civilization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Taiga expansion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/expand-taiga-era.py')
          s = p.read_text(encoding='utf-8')
          old = "if 'id: \"area-6\"' in stages:"
          new = "if 'label: \"大穀倉地帯を拓く\"' in stages:"
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/expand-taiga-era.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit expansion and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stages.ts lib/taiga.ts lib/shop.ts
          git rm scripts/expand-taiga-era.py .github/workflows/expand-taiga-era.yml
          git commit -m "Add same-era Taiga civilization expansion"
          git pull --rebase origin main
          git push
