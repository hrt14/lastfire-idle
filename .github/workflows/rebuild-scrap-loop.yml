name: Validate Scrap Planet game loop

on:
  push:
    branches:
      - agent/rebuild-scrap-game-loop

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-scrap-game-loop
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate
        shell: bash
        run: |
          set +e
          npm ci > /tmp/install.log 2>&1
          install_status=$?
          npm run lint > /tmp/lint.log 2>&1
          lint_status=$?
          npm run build > /tmp/build.log 2>&1
          build_status=$?

          {
            echo "install=$install_status"
            echo "lint=$lint_status"
            echo "build=$build_status"
            echo
            echo "--- install tail ---"
            tail -80 /tmp/install.log
            echo
            echo "--- lint tail ---"
            tail -120 /tmp/lint.log
            echo
            echo "--- build tail ---"
            tail -180 /tmp/build.log
          } > SCRAP_LOOP_STATUS.txt

          if [ "$install_status" -ne 0 ] || [ "$lint_status" -ne 0 ] || [ "$build_status" -ne 0 ]; then
            exit_code=1
          else
            exit_code=0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCRAP_LOOP_STATUS.txt
          git commit -m "Record Scrap Planet loop validation" || true
          git push origin HEAD:agent/rebuild-scrap-game-loop
          exit "$exit_code"
