name: Fix unreachable soup warehouse build pad

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move soup warehouse build pad into reachable area
        run: |
          test "$(grep -c 'padPos: { x: 1620, y: 450 }' data/stages.ts)" -eq 1
          sed -i 's/padPos: { x: 1620, y: 450 }/padPos: { x: 1620, y: 350 }/' data/stages.ts
          grep -q 'padPos: { x: 1620, y: 350 }' data/stages.ts
      - name: Commit fix and remove one-shot workflow
        run: |
          rm .github/workflows/fix-soup-pad.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stages.ts .github/workflows/fix-soup-pad.yml
          git commit -m "Fix unreachable soup warehouse build pad"
          git push origin HEAD:main
