name: Fix Taiga area-6 progression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply progression hotfix
        run: python fix-taiga-area6-progression.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit hotfix and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stages.ts lib/shop.ts
          git rm -f fix-taiga-area6-progression.py .github/workflows/fix-taiga-area6-progression.yml
          git commit -m "Fix Taiga progression beyond sixth area"
          git pull --rebase origin main
          git push
