name: Apply aquarium full visual theme

on:
  push:
    branches:
      - agent/aquarium-full-theme

permissions:
  contents: write

jobs:
  build-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wire aquarium visual theme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stages = Path('data/stages.ts')
          s = stages.read_text(encoding='utf-8')
          old = '''  /** 運ぶものの絵文字 */\n  itemIcon: string;\n  /** 作る場所が並ぶ帯（歩いて入れる） */'''
          new = '''  /** 運ぶものの絵文字 */\n  itemIcon: string;\n  /** ロジック上のstage idとは別に、画面の世界観だけを差し替える */\n  visualTheme?: "park" | "aquarium";\n  /** 作る場所が並ぶ帯（歩いて入れる） */'''
          if old not in s:
              raise SystemExit('StageDef visualTheme insertion target not found')
          stages.write_text(s.replace(old, new, 1), encoding='utf-8')

          aquarium = Path('data/aquarium.ts')
          s = aquarium.read_text(encoding='utf-8')
          old = '''const aquariumRuntimeDef: StageDef = {\n  id: "park",\n  name: "世界水族館",'''
          new = '''const aquariumRuntimeDef: StageDef = {\n  id: "park",\n  visualTheme: "aquarium",\n  name: "世界水族館",'''
          if old not in s:
              raise SystemExit('aquarium runtime theme target not found')
          aquarium.write_text(s.replace(old, new, 1), encoding='utf-8')

          shop = Path('components/Shop.tsx')
          s = shop.read_text(encoding='utf-8')
          import_old = 'import { drawAquariumExhibit } from "@/lib/aquariumArt";\n'
          import_new = 'import { drawAquariumExhibit } from "@/lib/aquariumArt";\nimport { drawAquariumHall } from "@/lib/aquariumTheme";\n'
          if import_old not in s:
              raise SystemExit('aquarium art import target not found')
          s = s.replace(import_old, import_new, 1)

          type_old = '''  area: {\n    rect: { x0: number; y0: number; x1: number; y1: number };\n    palette: { prop: string };\n  },\n  time: number,\n) => {\n  const { rect, palette } = area;\n  const park = stage().id === "park";\n  const cx = (rect.x0 + rect.x1) / 2;'''
          type_new = '''  area: {\n    id: string;\n    label?: string;\n    rect: { x0: number; y0: number; x1: number; y1: number };\n    palette: { floor: string; deep: string; prop: string };\n  },\n  time: number,\n) => {\n  const { rect, palette } = area;\n  const aquarium = stage().visualTheme === "aquarium";\n  const park = stage().id === "park" && !aquarium;\n  const cx = (rect.x0 + rect.x1) / 2;'''
          if type_old not in s:
              raise SystemExit('drawProps signature/theme target not found')
          s = s.replace(type_old, type_new, 1)

          marker = '''  const baseY = rect.y1 - 40;\n\n  if (park) {'''
          inject = '''  const baseY = rect.y1 - 40;\n\n  if (aquarium) {\n    drawAquariumHall(ctx, area, time);\n    return;\n  }\n\n  if (park) {'''
          if marker not in s:
              raise SystemExit('drawProps aquarium branch target not found')
          s = s.replace(marker, inject, 1)

          # drawProps以外に残るpark専用設備絵も、水族館では使わない。
          s = s.replace(
              'const park = stage().id === "park";',
              'const park = stage().id === "park" && stage().visualTheme !== "aquarium";'
          )
          shop.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit final aquarium theme and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stages.ts data/aquarium.ts components/Shop.tsx lib/aquariumTheme.ts
          git rm -f .github/workflows/apply-aquarium-full-theme.yml
          git commit -m "Give World Aquarium its own visual identity"
          git pull --rebase origin agent/aquarium-full-theme
          git push origin agent/aquarium-full-theme
