name: Aquarium fish scale safety

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-aquarium-fish-scale.py"
      - ".github/workflows/aquarium-fish-scale-safety.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply aquarium fish scale safety patch
        run: python3 scripts/patch-aquarium-fish-scale.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit aquarium fish scale safety
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep aquarium fish visible inside differentiated tanks"
          git push origin HEAD:main
