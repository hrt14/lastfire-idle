# Triggered after the workflow file existed on main.
name: Fix top page scrolling

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enable scrolling on the series selection page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/globals.css')
          text = path.read_text()

          old_body = '''  overscroll-behavior: none;
  touch-action: none;
  user-select: none;'''
          new_body = '''  overscroll-behavior: none;
  touch-action: auto;
  user-select: none;'''
          if old_body not in text:
              raise SystemExit('body touch-action anchor not found')
          text = text.replace(old_body, new_body, 1)

          old_top = '''  width: min(560px, 100%);
  min-height: 100svh;
  margin: 0 auto;'''
          new_top = '''  width: min(560px, 100%);
  height: 100svh;
  min-height: 0;
  margin: 0 auto;'''
          if old_top not in text:
              raise SystemExit('top height anchor not found')
          text = text.replace(old_top, new_top, 1)

          old_scroll = '''  gap: 1rem;
  overflow-y: auto;
  background:'''
          new_scroll = '''  gap: 1rem;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  touch-action: pan-y;
  -webkit-overflow-scrolling: touch;
  background:'''
          if old_scroll not in text:
              raise SystemExit('top scroll anchor not found')
          text = text.replace(old_scroll, new_scroll, 1)

          path.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-top-scroll.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/globals.css .github/workflows/fix-top-scroll.yml
          git commit -m "Fix scrolling on the series selection page"
          git push origin HEAD:main
