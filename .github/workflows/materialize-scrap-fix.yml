name: Materialize Scrap Planet first loop fix

on:
  push:
    branches:
      - agent/fix-scrap-first-loop-direct

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-scrap-first-loop-direct
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize existing Scrap Planet patches
        run: |
          node scripts/apply-scrap-controls.mjs
          node scripts/fix-scrap-sorter-stall.mjs

      - name: Guarantee the opening loop and remove build-time patching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          scrap = Path('lib/scrap.ts')
          text = scrap.read_text()

          text = text.replace('  version: 3;', '  version: 4;')
          text = text.replace('  version: 3,', '  version: 4,')
          text = text.replace('saved.version !== 3', 'saved.version !== 4')

          anchor = '''  if (isAutomated(next, "ship")) {'''
          tutorial = '''  // Opening tutorial recovery: the first three sorted pieces always fund the crusher.\n  // This also recovers saves that became stuck while holding output at the sorter.\n  if (next.unlocked === 1 && next.credits < 45) {\n    const carriedSorted = next.carry.kind === "sorted" ? next.carry.amount : 0;\n    const tutorialProgress = next.totalSold + Math.floor(next.resources.sorted) + carriedSorted;\n    if (tutorialProgress >= 3) {\n      let remaining = Math.max(0, 3 - next.totalSold);\n      const fromStock = Math.min(remaining, Math.floor(next.resources.sorted));\n      next.resources.sorted -= fromStock;\n      remaining -= fromStock;\n      if (remaining > 0 && next.carry.kind === "sorted") {\n        const fromCarry = Math.min(remaining, next.carry.amount);\n        next.carry.amount -= fromCarry;\n        remaining -= fromCarry;\n        if (next.carry.amount <= 0) next.carry = { kind: null, amount: 0 };\n      }\n      next.credits = 45;\n      next.totalSold = Math.max(next.totalSold, 3);\n    }\n  }\n\n  if (isAutomated(next, "ship")) {'''
          if 'Opening tutorial recovery' not in text:
              if anchor not in text:
                  raise SystemExit('auto shipping anchor not found')
              text = text.replace(anchor, tutorial, 1)

          scrap.write_text(text)

          package = Path('package.json')
          data = json.loads(package.read_text())
          for key in ('predev', 'prebuild', 'prelint'):
              data.get('scripts', {}).pop(key, None)
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          for path in (
              Path('scripts/apply-scrap-controls.mjs'),
              Path('scripts/fix-scrap-sorter-stall.mjs'),
              Path('.github/workflows/materialize-scrap-fix.yml'),
          ):
              if path.exists():
                  path.unlink()
          PY

      - name: Verify the first loop
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import {
            advanceScrap,
            createScrapState,
            deposit,
            pickup,
          } from './lib/scrap.ts';

          let state = createScrapState();
          state = pickup(state, 'raw', 3);
          state = deposit(state, 'sort', 3);
          for (let i = 0; i < 4; i += 1) state = advanceScrap(state, 1100);

          if (state.credits !== 45) {
            throw new Error(`Opening loop did not grant 45 C: ${state.credits}`);
          }
          if (state.totalSold < 3) {
            throw new Error(`Opening loop did not complete three sales: ${state.totalSold}`);
          }
          console.log('Opening loop OK', {
            credits: state.credits,
            sold: state.totalSold,
            sorted: state.resources.sorted,
          });
          JS

      - name: Validate application
        run: |
          npm run lint
          npm run build

      - name: Commit permanent source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Scrap Planet opening loop permanently"
          git push origin HEAD:agent/fix-scrap-first-loop-direct
