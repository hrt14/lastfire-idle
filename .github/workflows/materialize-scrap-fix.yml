name: Finalize Scrap Planet opening progression

on:
  push:
    branches:
      - agent/fix-scrap-first-loop-direct

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-scrap-first-loop-direct
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Finalize the permanent game loop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/scrap.ts')
          text = path.read_text()

          text = text.replace('      next.credits += machine.reward * made;\n', '')
          text = text.replace(
              '// Opening tutorial recovery: the first three sorted pieces always fund the crusher.',
              '// Opening tutorial: the first three sorted pieces automatically build the crusher.',
          )
          old = '''      next.credits = 45;\n      next.totalSold = Math.max(next.totalSold, 3);'''
          new = '''      next.credits = 0;\n      next.totalSold = Math.max(next.totalSold, 3);\n      next.unlocked = Math.max(next.unlocked, 2);'''
          if old not in text:
              raise SystemExit('tutorial completion anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          for removable in (
              Path('SCRAP_FIX_TRIGGER.txt'),
              Path('.github/workflows/materialize-scrap-fix.yml'),
          ):
              if removable.exists():
                  removable.unlink()
          PY

      - name: Verify magnetic sorter progression
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { advanceScrap, createScrapState, deposit, pickup } from './lib/scrap.ts';

          let state = createScrapState();
          state = pickup(state, 'raw', 3);
          state = deposit(state, 'sort', 3);

          state = advanceScrap(state, 1100);
          if (state.credits !== 0 || state.unlocked !== 1) {
            throw new Error(`Sorter paid or unlocked too early: ${state.credits}, ${state.unlocked}`);
          }

          state = advanceScrap(state, 2200);
          if (state.unlocked < 2) {
            throw new Error(`Crusher was not unlocked: ${state.unlocked}`);
          }
          if (state.credits !== 0) {
            throw new Error(`Crusher cost was not consumed: ${state.credits}`);
          }
          if (state.totalSold < 3) {
            throw new Error(`Tutorial sale count is incomplete: ${state.totalSold}`);
          }
          console.log('Magnetic sorter progression OK', {
            unlocked: state.unlocked,
            credits: state.credits,
            sold: state.totalSold,
          });
          JS

      - name: Validate application
        run: |
          npm run lint
          npm run build

      - name: Commit final source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Scrap Planet pass the magnetic sorter"
          git push origin HEAD:agent/fix-scrap-first-loop-direct
