name: Finalize aquarium exhibit visuals

on:
  push:
    branches:
      - agent/aquarium-unique-exhibit-visuals

permissions:
  contents: write

jobs:
  build-and-finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify 54 unique exhibit definitions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('lib/aquariumArt.ts', 'utf8');
          const names = [...s.matchAll(/name: "([^"]+)"/g)].map(m => m[1]);
          if (names.length !== 54) throw new Error(`expected 54 exhibit visuals, got ${names.length}`);
          if (new Set(names).size !== 54) throw new Error('duplicate exhibit visual names found');
          console.log(`verified ${names.length} unique exhibit visual definitions`);
          NODE
      - name: Production build
        run: npm run build
      - name: Bake generated wiring into source and remove one-time tooling
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.scripts.predev;
          delete pkg.scripts.prebuild;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx data/aquarium.ts lib/aquariumArt.ts package.json
          git rm -f scripts/wire-aquarium-visuals.mjs .github/workflows/validate-aquarium-visuals.yml
          git commit -m "Bake unique aquarium exhibit visuals into source"
          git pull --rebase origin agent/aquarium-unique-exhibit-visuals
          git push origin HEAD:agent/aquarium-unique-exhibit-visuals
