name: Aquarium discovery staff visual patch

on:
  push:
    branches:
      - agent/aquarium-background-label-fix
    paths:
      - .github/workflows/aquarium-staff-visual-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-background-label-fix
          fetch-depth: 0
      - name: Patch discovery staff visual
        run: python .github/scripts/aquarium_staff_visual_patch.py
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit patched game file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx
          git commit -m "Differentiate aquarium discovery staff from cooks"
          git push origin HEAD:agent/aquarium-background-label-fix
