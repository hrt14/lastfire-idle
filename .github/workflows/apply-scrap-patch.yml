name: Apply Scrap Planet integration

on:
  push:
    branches:
      - agent/scrap-planet

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scrap-planet
      - name: Patch shared save and series menu
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          text = page.read_text()
          anchor = '        <h2 className="series-head is-soon">\n'
          block = '''        <h2 className="series-head">\n          <span aria-hidden>♻️</span> SCRAP PLANET\n        </h2>\n        <ul className="stages">\n          <li className="stage-card stage-scrap">\n            <div className="stage-art" aria-hidden>\n              🏭\n            </div>\n            <div className="stage-body">\n              <strong>スクラップ工場</strong>\n              <p>宇宙ゴミを加工し、ロボットで全工程を自動化</p>\n              <span className="stage-progress">9段階の加工ライン・新登場</span>\n            </div>\n            <a className="stage-go" href="/scrap">\n              はじめる\n            </a>\n          </li>\n        </ul>\n\n'''
          if block not in text:
              if anchor not in text:
                  raise SystemExit('page anchor not found')
              text = text.replace(anchor, block + anchor, 1)
              page.write_text(text)

          store = Path('lib/shopStore.ts')
          text = store.read_text()
          type_anchor = '  stages: Partial<Record<StageId, Persisted>>;\n  /** ガチャで当てた見た目（ステージ共通） */'
          type_replacement = '  stages: Partial<Record<StageId, Persisted>>;\n  /** SCRAP PLANETの専用工場データ。同じユーザーセーブ内に保存する */\n  scrap?: Record<string, unknown>;\n  /** ガチャで当てた見た目（ステージ共通） */'
          if 'scrap?: Record<string, unknown>;' not in text:
              if type_anchor not in text:
                  raise SystemExit('vault type anchor not found')
              text = text.replace(type_anchor, type_replacement, 1)

          read_anchor = '      stages: (parsed.stages ?? {}) as Partial<Record<StageId, Persisted>>,\n      skins: Array.from(new Set(["default", ...owned])), '
          read_replacement = '      stages: (parsed.stages ?? {}) as Partial<Record<StageId, Persisted>>,\n      scrap:\n        parsed.scrap && typeof parsed.scrap === "object"\n          ? (parsed.scrap as Record<string, unknown>)\n          : undefined,\n      skins: Array.from(new Set(["default", ...owned])), '
          if 'parsed.scrap && typeof parsed.scrap' not in text:
              if read_anchor not in text:
                  raise SystemExit('vault read anchor not found')
              text = text.replace(read_anchor, read_replacement, 1)
          store.write_text(text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-scrap-patch.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx lib/shopStore.ts .github/workflows/apply-scrap-patch.yml
          git commit -m "Integrate Scrap Planet with the shared game save"
          git push origin HEAD:agent/scrap-planet
