name: One-time add Dream Park horror expansion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-add-dream-park-horror.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add left-side horror expansion
        run: python3 scripts/patch_dream_park_horror.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-add-dream-park-horror.yml
          rm -f scripts/patch_dream_park_horror.py
          git add data/stages.ts lib/shop.ts components/Shop.tsx .github/workflows/one-time-add-dream-park-horror.yml scripts/patch_dream_park_horror.py
          git commit -m "Add Dream Park horror expansion"
          git push origin main
