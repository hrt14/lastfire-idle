name: One-time Fire early outdoor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fire-early-outdoor.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Fire early outdoor pass
        run: python3 scripts/patch_fire_early_outdoor.py
      - name: Install dependencies
        run: npm ci
      - name: Lint changed code
        run: npx eslint components/Shop.tsx
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fire-early-outdoor.yml
          rm -f scripts/patch_fire_early_outdoor.py
          git add components/Shop.tsx .github/workflows/one-time-fire-early-outdoor.yml scripts/patch_fire_early_outdoor.py
          git commit -m "Turn Fire early areas into outdoor settlements"
          git push origin main
