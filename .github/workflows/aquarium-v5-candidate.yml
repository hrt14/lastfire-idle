name: Aquarium v5 candidate validation

on:
  push:
    branches:
      - agent/aquarium-square-background-v5-candidate
    paths:
      - .github/workflows/aquarium-v5-candidate.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-square-background-v5-candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply visually reviewed aquarium production diff
        run: |
          git fetch origin agent/aquarium-square-background-v5
          git diff 6e21bda44d605600029404352e372730001e3775 origin/agent/aquarium-square-background-v5 -- components/Shop.tsx lib/aquariumTheme.ts > /tmp/aquarium-v5.patch
          git apply --3way /tmp/aquarium-v5.patch
      - name: Install dependencies
        run: npm ci
      - name: Build latest main plus aquarium v5
        run: npm run build
      - name: Commit candidate production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx lib/aquariumTheme.ts
          git diff --cached --quiet && exit 0
          git commit -m "Adapt aquarium gallery backgrounds to square layout"
          git push origin HEAD:agent/aquarium-square-background-v5-candidate
