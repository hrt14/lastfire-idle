name: One-time tune Dream Park horror economy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-tune-dream-park-horror-economy.yml"

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Tune horror prices
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('data/stages.ts')
          text = path.read_text()
          replacements = [
            ('id: "area-10",\n    label:', 'id: "area-10",\n    label:'),
            ('price: 100000000000,\n    rect: { x0: -360', 'price: 70000000000,\n    rect: { x0: -360'),
            ('price: 420000000000,\n    rect: { x0: -720', 'price: 180000000000,\n    rect: { x0: -720'),
            ('price: 1400000000000,\n    rect: { x0: -1080', 'price: 500000000000,\n    rect: { x0: -1080'),
            ('price: 120000000000, area: 10, label:', 'price: 60000000000, area: 10, label:'),
            ('price: 520000000000, area: 11, label:', 'price: 180000000000, area: 11, label:'),
            ('price: 1600000000000, area: 12, label:', 'price: 520000000000, area: 12, label:'),
            ('x: -300, price: 130000000000, label:', 'x: -300, price: 75000000000, label:'),
            ('x: -200, price: 180000000000, label:', 'x: -200, price: 100000000000, label:'),
            ('x: -100, price: 260000000000, label:', 'x: -100, price: 140000000000, label:'),
            ('x: -660, price: 520000000000, label:', 'x: -660, price: 220000000000, label:'),
            ('x: -540, price: 720000000000, label:', 'x: -540, price: 300000000000, label:'),
            ('x: -420, price: 980000000000, label:', 'x: -420, price: 420000000000, label:'),
            ('x: -1020, price: 1800000000000, label:', 'x: -1020, price: 700000000000, label:'),
            ('x: -900, price: 2600000000000, label:', 'x: -900, price: 950000000000, label:'),
            ('x: -780, price: 4000000000000, label:', 'x: -780, price: 1300000000000, label:'),
            ('price: 160000000000, label:', 'price: 80000000000, label:'),
            ('price: 190000000000, label:', 'price: 95000000000, label:'),
            ('price: 650000000000, label:', 'price: 240000000000, label:'),
            ('price: 900000000000, label:', 'price: 320000000000, label:'),
            ('price: 2200000000000, label:', 'price: 700000000000, label:'),
            ('price: 2600000000000, label:', 'price: 850000000000, label:'),
            ('price: 3200000000000, label:', 'price: 1050000000000, label:'),
          ]

          changed = 0
          for old, new in replacements:
              if old == new:
                  continue
              if old not in text:
                  if new in text:
                      continue
                  raise SystemExit(f'missing anchor: {old[:80]}')
              text = text.replace(old, new, 1)
              changed += 1

          path.write_text(text)
          print(f'updated {changed} horror economy values')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Lint changed file
        run: npx eslint data/stages.ts
      - name: Build
        run: npm run build
      - name: Commit tuned economy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-tune-dream-park-horror-economy.yml
          git add data/stages.ts .github/workflows/one-time-tune-dream-park-horror-economy.yml
          git commit -m "Balance Dream Park horror economy"
          git push origin main
