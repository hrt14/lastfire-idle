name: Rebase aquarium visuals onto latest main

on:
  push:
    branches:
      - agent/aquarium-unique-exhibit-visuals

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main without clobbering concurrent game work
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit -X theirs || true

          python - <<'PY'
          from pathlib import Path

          shop = Path('components/Shop.tsx')
          s = shop.read_text(encoding='utf-8')
          imp = 'import { drawAquariumExhibit } from "@/lib/aquariumArt";'
          if imp not in s:
              marker = '"use client";\n'
              if marker not in s:
                  raise SystemExit('Shop client marker missing')
              s = s.replace(marker, marker + '\n' + imp + '\n', 1)
          hook = '''  if (art.startsWith("aquarium-")) {\n    return drawAquariumExhibit(ctx, art, Math.round(x * 31 + y * 17));\n  }\n\n'''
          if 'art.startsWith("aquarium-")' not in s:
              marker = '  if (art === "fish") {'
              if marker not in s:
                  raise SystemExit('generic fish renderer missing')
              s = s.replace(marker, hook + marker, 1)
          shop.write_text(s, encoding='utf-8')

          aq = Path('data/aquarium.ts')
          s = aq.read_text(encoding='utf-8')
          if 'art: `aquarium-${area}-${index}`' not in s:
              marker = '      art: "fish",'
              if marker not in s:
                  raise SystemExit('aquarium art marker missing')
              s = s.replace(marker, '      art: `aquarium-${area}-${index}`,', 1)
          aq.write_text(s, encoding='utf-8')
          PY

          git add components/Shop.tsx data/aquarium.ts lib/aquariumArt.ts
          git commit -m "Reapply aquarium visuals on latest main" || true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify 54 unique exhibit definitions
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('lib/aquariumArt.ts', 'utf8');
          const names = [...s.matchAll(/name: "([^"]+)"/g)].map(m => m[1]);
          if (names.length !== 54) throw new Error(`expected 54, got ${names.length}`);
          if (new Set(names).size !== 54) throw new Error('duplicate exhibit names');
          NODE
      - run: npm run build
      - name: Push and remove one-time workflow
        shell: bash
        run: |
          git rm -f .github/workflows/rebase-aquarium-visuals.yml
          git commit -m "Remove aquarium rebase helper"
          git push origin HEAD:agent/aquarium-unique-exhibit-visuals
