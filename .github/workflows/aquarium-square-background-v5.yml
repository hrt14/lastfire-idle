name: Aquarium square background v5 validation

on:
  push:
    branches:
      - agent/aquarium-square-background-v5
    paths:
      - .github/scripts/aquarium_square_background_v5.py
      - .github/workflows/aquarium-square-background-v5.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-square-background-v5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply square background patch
        run: python .github/scripts/aquarium_square_background_v5.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx lib/aquariumTheme.ts
          git diff --cached --quiet && exit 0
          git commit -m "Adapt aquarium backgrounds to square gallery layout"
          git push origin HEAD:agent/aquarium-square-background-v5
