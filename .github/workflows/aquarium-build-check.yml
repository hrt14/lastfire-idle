name: Aquarium build check

on:
  push:
    branches:
      - agent/aquarium-background-label-fix
    paths:
      - .github/workflows/aquarium-build-check.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
