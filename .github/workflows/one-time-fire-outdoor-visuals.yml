name: One-time Fire outdoor visuals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fire-outdoor-visuals.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Fire outdoor visual overhaul
        run: python3 scripts/patch_fire_outdoor_visuals.py
      - name: Fix effects state initialization for React lint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/Shop.tsx')
          s = p.read_text()
          pattern = re.compile(r'(?P<indent>\s*)setEffectsOn\(on\);\n(?P=indent)\}, \[\]\);')
          m = pattern.search(s)
          if not m:
              raise SystemExit('effects init anchor not found')
          indent = m.group('indent')
          replacement = (
              f'{indent}const timer = window.setTimeout(() => setEffectsOn(on), 0);\n'
              f'{indent}return () => window.clearTimeout(timer);\n'
              f'{indent}}}, []);'
          )
          p.write_text(s[:m.start()] + replacement + s[m.end():])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Lint changed code
        run: npx eslint components/Shop.tsx
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fire-outdoor-visuals.yml
          rm -f scripts/patch_fire_outdoor_visuals.py
          git add components/Shop.tsx app/globals.css .github/workflows/one-time-fire-outdoor-visuals.yml scripts/patch_fire_outdoor_visuals.py
          git commit -m "Make Fire world feel outdoors and primitive"
          git push origin main
