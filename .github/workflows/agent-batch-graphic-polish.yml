name: Apply accumulated graphic polish

on:
  push:
    branches:
      - agent/graphic-refresh-batch-aug11

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graphic-refresh-batch-aug11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply hero-scale and depth polish
        run: node scripts/apply-batch-graphic-polish.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint touched graphic file
        run: npx eslint lib/worldGraphicPass.ts
      - name: Full production build
        run: npm run build
      - name: Commit validated accumulated polish
        run: |
          rm scripts/apply-batch-graphic-polish.mjs
          rm .github/workflows/agent-batch-graphic-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/worldGraphicPass.ts scripts/apply-batch-graphic-polish.mjs .github/workflows/agent-batch-graphic-polish.yml
          git commit -m "Accumulate hero-scale and depth graphic polish"
          git push origin HEAD:agent/graphic-refresh-batch-aug11
