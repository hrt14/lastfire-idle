name: Validate Scrap Planet rebuild

on:
  push:
    branches:
      - agent/rebuild-scrap-arcade

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-scrap-arcade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and validate
        run: |
          set +e
          npm ci > /tmp/install.log 2>&1
          INSTALL=$?
          npm run lint > /tmp/lint.log 2>&1
          LINT=$?
          npm run build > /tmp/build.log 2>&1
          BUILD=$?
          {
            echo "install=$INSTALL"
            echo "lint=$LINT"
            echo "build=$BUILD"
            echo
            echo "--- lint tail ---"
            tail -n 80 /tmp/lint.log
            echo
            echo "--- build tail ---"
            tail -n 100 /tmp/build.log
          } > SCRAP_REBUILD_STATUS.txt
      - name: Remove one-shot workflow
        run: rm .github/workflows/validate-scrap-rebuild.yml
      - name: Commit validation result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCRAP_REBUILD_STATUS.txt .github/workflows/validate-scrap-rebuild.yml
          git commit -m "Validate Scrap Planet arcade rebuild"
          git push origin HEAD:agent/rebuild-scrap-arcade
