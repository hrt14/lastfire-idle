name: Fix ramen doorway traffic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make ramen guests visibly use the doorway
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          shop = Path('components/Shop.tsx')
          s = shop.read_text(encoding='utf-8')
          old = 'const crowd = Math.min(14, Math.round((draw - 1) * 4));'
          new = '''// 壁のある店では、横切るだけの飾りの通行人が「入口を使わない客」に見える。\n      // 実際の customer だけを外に描き、戸口へ向かう動きがそのまま見えるようにする。\n      const crowd = wallsOn() ? 0 : Math.min(14, Math.round((draw - 1) * 4));'''
          if old not in s:
              raise SystemExit('street crowd target not found')
          shop.write_text(s.replace(old, new, 1), encoding='utf-8')

          engine = Path('lib/shop.ts')
          s = engine.read_text(encoding='utf-8')
          old = 'const fallback = { x: street.x + (Math.random() * 40 - 20), y: street.y };'
          new = '''// 壁のある店は、実客を戸口の正面に出す。\n  // 入口からずれた通行人に見えたり、斜め進入で壁判定に触れたりしないようにする。\n  const fallback = {\n    x: street.x + (wallsOn() ? 0 : Math.random() * 40 - 20),\n    y: street.y,\n  };'''
          if old not in s:
              raise SystemExit('guest entry target not found')
          engine.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit doorway hotfix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx lib/shop.ts
          git rm -f .github/workflows/fix-build-watchdog.yml scripts/fix-build-watchdog.py || true
          git commit -m "Fix ramen guests entering through doors"
          git pull --rebase origin main
          git push
