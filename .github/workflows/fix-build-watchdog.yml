name: Fix construction watchdog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply construction watchdog
        run: python scripts/fix-build-watchdog.py

      - name: Fix TypeScript narrowing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/shop.ts')
          s = p.read_text(encoding='utf-8')
          old = '''  if (buildPlan.site?.needs) {
    const site = buildPlan.site;
    for (const [kind, need] of Object.entries(site.needs)) {'''
          new = '''  if (buildPlan.site?.needs) {
    const site = buildPlan.site;
    const needs = site.needs ?? {};
    for (const [kind, need] of Object.entries(needs)) {'''
          assert old in s, 'narrowing anchor not found'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit hotfix and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shop.ts
          git rm -f scripts/fix-build-watchdog.py .github/workflows/fix-build-watchdog.yml
          git commit -m "Add construction dependency watchdog"
          git pull --rebase origin main
          git push
