name: Fix construction watchdog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply construction watchdog
        run: python scripts/fix-build-watchdog.py

      - name: Fix TypeScript narrowing
        run: python -c "from pathlib import Path; p=Path('lib/shop.ts'); s=p.read_text(encoding='utf-8'); s=s.replace('Object.entries(site.needs)', 'Object.entries(site.needs ?? {})'); p.write_text(s,encoding='utf-8')"

      - name: Commit hotfix and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shop.ts
          git rm -f scripts/fix-build-watchdog.py .github/workflows/fix-build-watchdog.yml
          git commit -m "Add construction dependency watchdog"
          git pull --rebase origin main
          git push
