name: Fix onsen night street access

on:
  push:
    branches:
      - fix/onsen-night-street-access

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/onsen-night-street-access
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch multi-door support and onsen north exit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shop = Path('lib/shop.ts')
          text = shop.read_text()

          area_marker = 'export type AreaSpec = {'
          if area_marker not in text:
              raise SystemExit('AreaSpec marker not found')
          text = text.replace(
              area_marker,
              '''export type DoorSpec = {\n  x: number;\n  w: number;\n  side?: "s" | "n" | "e" | "w";\n  /** この id が開くまで、この戸口は壁のまま */\n  unlockAfter?: string;\n};\n\nexport type AreaSpec = {''',
              1,
          )

          old_door_type = '  door?: { x: number; w: number; side?: "s" | "n" | "e" | "w" };'
          new_door_type = '  door?: DoorSpec | DoorSpec[];'
          if old_door_type not in text:
              raise SystemExit('door type marker not found')
          text = text.replace(old_door_type, new_door_type, 1)

          old_opening = '''    const { x, w, side = "s" } = area.door;\n    const half = w / 2;\n    const flat = side === "s" || side === "n";\n    const wall = side === "s" ? box.y1 : side === "n" ? box.y0 : side === "e" ? box.x1 : box.x0;\n    const rect = flat\n      ? { x0: x - half, x1: x + half, y0: wall - 14, y1: wall + 14 }\n      : { x0: wall - 14, x1: wall + 14, y0: x - half, y1: x + half };\n    // 戸口の外がどの通りに面しているか（面していなければ、ただの屋外）\n    const out = flat\n      ? { x, y: side === "s" ? wall + 22 : wall - 22 }\n      : { x: side === "e" ? wall + 22 : wall - 22, y: x };\n    openings.push({ rect, nodes: [area.building, roadAt(out) ?? "out"] });'''
          new_opening = '''    const doors = Array.isArray(area.door) ? area.door : [area.door];\n    for (const door of doors) {\n      if (door.unlockAfter && !state.unlocked.includes(door.unlockAfter)) continue;\n      const { x, w, side = "s" } = door;\n      const half = w / 2;\n      const flat = side === "s" || side === "n";\n      const wall = side === "s" ? box.y1 : side === "n" ? box.y0 : side === "e" ? box.x1 : box.x0;\n      const rect = flat\n        ? { x0: x - half, x1: x + half, y0: wall - 14, y1: wall + 14 }\n        : { x0: wall - 14, x1: wall + 14, y0: x - half, y1: x + half };\n      // 戸口の外がどの通りに面しているか（面していなければ、ただの屋外）\n      const out = flat\n        ? { x, y: side === "s" ? wall + 22 : wall - 22 }\n        : { x: side === "e" ? wall + 22 : wall - 22, y: x };\n      openings.push({ rect, nodes: [area.building, roadAt(out) ?? "out"] });\n    }'''
          if old_opening not in text:
              raise SystemExit('wall opening block not found')
          text = text.replace(old_opening, new_opening, 1)
          shop.write_text(text)

          stages = Path('data/stages.ts')
          text = stages.read_text()
          old_annai = '''    building: "annai",\n    shop: 2,\n    door: { x: 1420, w: 60, side: "w" },'''
          new_annai = '''    building: "annai",\n    shop: 2,\n    door: [\n      // 到着広場側の既存入口\n      { x: 1420, w: 60, side: "w" },\n      // 夜見世通りが開いたら、北壁からそのまま通りへ抜けられる\n      { x: 2300, w: 72, side: "n", unlockAfter: "area-24" },\n    ],'''
          if old_annai not in text:
              raise SystemExit('annai door marker not found')
          text = text.replace(old_annai, new_annai, 1)
          stages.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit fix to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shop.ts data/stages.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix: 夜見世通りへ抜けられない温泉街の入口を修正"
          git push origin HEAD:fix/onsen-night-street-access
