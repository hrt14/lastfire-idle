name: Apply graphics batch 4

on:
  push:
    branches:
      - agent/graphic-refresh-batch-aug11
    paths:
      - .github/workflows/agent-graphic-batch-4.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graphic-refresh-batch-aug11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply fourth accumulated graphics batch
        run: node scripts/apply-graphic-batch-4.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint graphic pass
        run: npx eslint lib/worldGraphicPass.ts
      - name: Full production build
        run: npm run build
      - name: Commit validated fourth batch
        run: |
          rm scripts/apply-graphic-batch-4.mjs
          rm .github/workflows/agent-graphic-batch-4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/worldGraphicPass.ts scripts/apply-graphic-batch-4.mjs .github/workflows/agent-graphic-batch-4.yml
          git commit -m "Add spatial transitions and environmental motion"
          git push origin HEAD:agent/graphic-refresh-batch-aug11
