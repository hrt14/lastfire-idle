name: Apply graphic refresh renderer patch

on:
  push:
    branches:
      - agent/graphic-refresh-fire-taiga
    paths:
      - .github/workflows/agent-graphic-refresh.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graphic-refresh-fire-taiga

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch Shop renderer
        run: python scripts/agent_graphic_refresh.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated renderer patch
        shell: bash
        run: |
          rm .github/workflows/agent-graphic-refresh.yml scripts/agent_graphic_refresh.py
          git config user.name "openai-agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add components/Shop.tsx lib/worldGraphicPass.ts .github/workflows/agent-graphic-refresh.yml scripts/agent_graphic_refresh.py
          git diff --cached --quiet && exit 0
          git commit -m "improve fire and river civilization graphics"
          git push origin HEAD:agent/graphic-refresh-fire-taiga
