name: Apply living world graphic pass

on:
  push:
    branches:
      - agent/graphic-refresh-living-world

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graphic-refresh-living-world
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply living world graphics
        run: node scripts/apply-living-world-pass.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint touched graphic file
        run: npx eslint lib/worldGraphicPass.ts
      - name: Full production build
        run: npm run build
      - name: Commit validated living world pass
        run: |
          rm scripts/apply-living-world-pass.mjs
          rm .github/workflows/agent-living-world-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/worldGraphicPass.ts scripts/apply-living-world-pass.mjs .github/workflows/agent-living-world-pass.yml
          git commit -m "Make population and logistics visible in the world"
          git push origin HEAD:agent/graphic-refresh-living-world
