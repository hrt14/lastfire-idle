name: Apply classic stage visual overhaul

on:
  push:
    branches:
      - agent/visual-overhaul-ramen-park-onsen-aug11
    paths:
      - .github/workflows/agent-classic-stage-visual-overhaul.yml

permissions:
  contents: write

jobs:
  integrate-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/visual-overhaul-ramen-park-onsen-aug11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Integrate visual overhaul
        run: node scripts/apply-classic-stage-visual-overhaul.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint visual overhaul
        run: npx eslint lib/stageVisualOverhaul.ts components/Shop.tsx
      - name: Full production build
        run: npm run build
      - name: Commit validated visual overhaul
        run: |
          rm scripts/apply-classic-stage-visual-overhaul.mjs
          rm .github/workflows/agent-classic-stage-visual-overhaul.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx lib/stageVisualOverhaul.ts scripts/apply-classic-stage-visual-overhaul.mjs .github/workflows/agent-classic-stage-visual-overhaul.yml
          git commit -m "Apply 10-pass visual overhaul to ramen park and onsen"
          git push origin HEAD:agent/visual-overhaul-ramen-park-onsen-aug11
