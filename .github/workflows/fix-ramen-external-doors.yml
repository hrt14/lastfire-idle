name: Fix ramen external doors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply door collision patch
        run: python scripts/fix-ramen-doors.py
      - name: Validate production build
        run: |
          npm ci
          npm run build
      - name: Commit fix
        run: |
          rm .github/workflows/fix-ramen-external-doors.yml scripts/fix-ramen-doors.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shop.ts .github/workflows/fix-ramen-external-doors.yml scripts/fix-ramen-doors.py
          git commit -m "Fix ramen exterior door collision"
          git pull --rebase origin main
          git push origin HEAD:main
