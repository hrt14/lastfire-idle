name: One-time fix Taiga builder deadlock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch direct-link construction priority
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("lib/shop.ts"); s=p.read_text(encoding="utf-8"); old="    const made = stoveItem(fromStove);\n    const slot = stationAccepts(state, toStove, made);\n"; new="    const made = stoveItem(fromStove);\n    /* 建築が同じ資材を必要としている間は、直結設備が資材を独占しない */\n    const buildNeedsMade = openStoves(state).some(\n      (stove) =>\n        isBuild(stove) && stationAccepts(state, stove, made) === \\"build\\",\n    );\n    if (buildNeedsMade) continue;\n    const slot = stationAccepts(state, toStove, made);\n"; assert s.count(old)==1, f"target count={s.count(old)}"; p.write_text(s.replace(old,new,1), encoding="utf-8")'
          grep -q 'const buildNeedsMade = openStoves(state).some' lib/shop.ts

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shop.ts
          git rm .github/workflows/one-time-fix-taiga-builder.yml
          git commit -m "fix: prevent Taiga construction resources from being starved"
          git push
