name: One-time fix Taiga builder deadlock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch direct-link construction priority
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('lib/shop.ts'); s=p.read_text(encoding='utf-8'); old=base64.b64decode('ICAgIGNvbnN0IG1hZGUgPSBzdG92ZUl0ZW0oZnJvbVN0b3ZlKTsKICAgIGNvbnN0IHNsb3QgPSBzdGF0aW9uQWNjZXB0cyhzdGF0ZSwgdG9TdG92ZSwgbWFkZSk7Cg==').decode(); new=base64.b64decode('').decode(); assert s.count(old)==1, 'target count='+str(s.count(old)); p.write_text(s.replace(old,new,1), encoding='utf-8')"
          grep -q 'const buildNeedsMade = openStoves(state).some' lib/shop.ts

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shop.ts
          git rm .github/workflows/one-time-fix-taiga-builder.yml
          git commit -m "fix: prevent Taiga construction resources from being starved"
          git push
