name: One-time fill lower volcano area

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-fill-volcano-lower.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Add lower volcano content
        run: python3 scripts/patch_volcano_lower.py
      - name: Install dependencies
        run: npm ci
      - name: Lint changed file
        run: npx eslint data/stages.ts
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-fill-volcano-lower.yml
          rm -f scripts/patch_volcano_lower.py
          git add data/stages.ts .github/workflows/one-time-fill-volcano-lower.yml scripts/patch_volcano_lower.py
          git commit -m "Expand lower volcano attractions and income"
          git push origin main
