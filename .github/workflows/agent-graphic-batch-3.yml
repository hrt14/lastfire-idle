name: Apply graphics batch 3

on:
  push:
    branches:
      - agent/graphic-refresh-batch-aug11

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/graphic-refresh-batch-aug11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply third accumulated graphics batch
        run: node scripts/apply-graphic-batch-3.mjs
      - name: Install dependencies
        run: npm ci
      - name: Lint graphic pass
        run: npx eslint lib/worldGraphicPass.ts
      - name: Full production build
        run: npm run build
      - name: Commit validated third batch
        run: |
          rm scripts/apply-graphic-batch-3.mjs
          rm .github/workflows/agent-graphic-batch-3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Accumulate construction foreshadowing and area atmosphere"
          git push origin HEAD:agent/graphic-refresh-batch-aug11
