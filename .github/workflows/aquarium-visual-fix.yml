name: Aquarium visual patch

on:
  push:
    branches:
      - agent/aquarium-background-label-fix
    paths:
      - .github/workflows/aquarium-visual-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-background-label-fix
          fetch-depth: 0

      - name: Patch aquarium background and labels
        run: python .github/scripts/run_aquarium_patch.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx lib/aquariumTheme.ts data/aquarium-visual-v3.ts
          git commit -m "Fix aquarium backgrounds and label readability"
          git push origin HEAD:agent/aquarium-background-label-fix
