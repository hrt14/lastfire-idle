name: Aquarium visual patch

on:
  push:
    branches:
      - agent/aquarium-background-label-fix
    paths:
      - .github/workflows/aquarium-visual-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/aquarium-background-label-fix
          fetch-depth: 0

      - name: Final aquarium label cleanup
        run: python .github/scripts/aquarium_cleanup.py

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/Shop.tsx
          git commit -m "Polish aquarium exhibit labels"
          git push origin HEAD:agent/aquarium-background-label-fix
